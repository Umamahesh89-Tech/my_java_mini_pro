# Application Name
spring.application.name=banksphere

# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/banksphere
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
banksphere.jwt.secret=banksphere-secret-key-must-be-at-least-32-characters-long
banksphere.jwt.expiration-ms=86400000
banksphere.jwt.expiration=86400000

# SQL Initialization
spring.sql.init.mode=never

# AI Provider: Google Gemini
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=gemini-3.5-flash-lite

# AI Configuration
spring.ai.openai.chat.temperature=0.3
spring.ai.openai.chat.max-tokens=400

# AI Timeout Configuration
spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=1