# Application Name
spring.application.name=banksphere

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/banksphere
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
banksphere.jwt.secret=banksphere-secret-key-must-be-at-least-32-characters-long
banksphere.jwt.expiration-ms=86400000
banksphere.jwt.expiration=86400000

# SQL Initialization
spring.sql.init.mode=never