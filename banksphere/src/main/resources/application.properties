# Application Name
spring.application.name=banksphere

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/banksphere
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
banksphere.jwt.secret=banksphere-secret-key-must-be-at-least-32-characters-long
banksphere.jwt.expiration-ms=86400000
banksphere.jwt.expiration=86400000

# SQL Initialization
spring.sql.init.mode=never
# AI provider: Google Gemini, free key from Google AI Studio
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.model=gemini-3.5-flash-lite

# Steady answers, and a cap on length and cost
spring.ai.openai.chat.temperature=0.3
spring.ai.openai.chat.max-tokens=400

# Give up after 30 seconds instead of waiting for minutes
spring.ai.openai.timeout=30s
spring.ai.openai.max-retries=1

